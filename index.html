<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cad">
<title>Bajaj Garage Finder</title>
<style>
  :root { --brand:#0b5cad; --brand-dark:#084a8c; --bg:#f2f4f7; --card:#fff; --text:#16202c; --muted:#5f6b7a; --border:#e2e6ec; --warn:#b26a00; --warn-bg:#fff6e5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f141b; --card:#18202b; --text:#eef2f7; --muted:#9aa6b5; --border:#2a3442; --warn-bg:#2b2112; --warn:#f0b35a; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; padding: calc(env(safe-area-inset-top,0px) + 14px) 16px 12px; }
  .brand { display:flex; align-items:center; gap:12px; margin:0 0 10px; }
  .brand img { height:44px; width:auto; background:#fff; border-radius:8px; padding:4px 6px; flex:0 0 auto; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; line-height:1.2; }
  .search { position: relative; }
  .search input { width:100%; font-size:16px; padding:12px 40px 12px 14px; border:none; border-radius:10px; background:#fff; color:#16202c; outline:none; }
  .search .clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:20px; color:#5f6b7a; padding:6px 10px; cursor:pointer; display:none; }
  .search .clear.show { display:block; }
  .seg { display:flex; background: rgba(255,255,255,.18); border-radius:10px; padding:3px; margin-top:10px; }
  .seg button { flex:1; border:none; background:transparent; color:#fff; padding:9px 4px; font-size:14px; border-radius:8px; cursor:pointer; font-weight:600; }
  .seg button.on { background:#fff; color:var(--brand-dark); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--text); padding:7px 13px; border-radius:999px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .count { padding: 8px 16px 6px; font-size: 13px; color: var(--muted); }
  main { padding: 0 16px 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card .name { font-weight:700; font-size:16px; line-height:1.3; margin:0; }
  .badge { flex:0 0 auto; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:#e7f0fb; color:var(--brand); text-transform:uppercase; letter-spacing:.3px; }
  .badge.pp { background:#e9f7ee; color:#1d7a3e; }
  .place { color: var(--muted); font-size: 13px; margin: 6px 0 0; line-height:1.4; }
  .phones { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
  .call { flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:6px; background: var(--brand); color:#fff; text-decoration:none; padding:11px 12px; border-radius:10px; }
  .call small { font-weight:400; opacity:.9; font-size:13px; }
  .map { flex:0 0 auto; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); color:var(--brand); text-decoration:none; padding:11px 14px; border-radius:10px; }
  .check { margin-top:10px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; padding: 8px 10px; border-radius: 8px; }
  .empty { text-align:center; color: var(--muted); padding: 40px 16px; }
  .empty b { display:block; color:var(--text); font-size:16px; margin-bottom:6px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding: 0 16px 28px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAADUCAIAAACpqYniAAA3YElEQVR42u2dd3gU1frHv2dmtu9ms2mEJBBC770FkCrtKiBFEBQQQcCCFQvYft6LXr12QZGrXmxEVBAIXTpiAgQQUJSWh[...]" alt="logo"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search town, area, district or garage name" autocomplete="off" autocapitalize="words" enterkeyhint="search" aria-label="Search">
      <button class="clear" id="clear" aria-label="Clear search">&times;</button>
    </div>
    <div class="seg" id="seg">
      <button data-v="all" class="on">All services</button>
      <button data-v="Bajaji">Bajaji</button>
      <button data-v="Piki Piki">Piki Piki</button>
    </div>
    <!-- Link to the separate Parts Price app -->
    <a href="/fantastic-sniffle/Index_2.html" class="chip" style="margin-left:12px; background:rgba(255,255,255,.12); color:#fff; border-color:rgba(255,255,255,.12);">Parts price list</a>
  </header>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <main id="list"></main>
  <footer>Tap a number to call. Numbers are shown in +255 international format.</footer>
</div>

<script>
const SHOPS = [{"id": 1, "division": "Bajaji", "region": "Dar Es Salaam", "district": "Ilala", "location": "Gerezani", "name": "MeTL Branch", "phones": ["+255793505774"], "phone_display": "+255 79[...]"}];

const state = { q: "", division: "all", district: "all" };
const $ = id => document.getElementById(id);
const norm = s => String(s || "").normalize("NFD").replace(/[^\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9+ ]/g, " ").replace(/\s+/g, " ").trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const districts = [...new Set(SHOPS.map(s => s.district))].sort();

function haystack(s) {
  return norm([s.name, s.location, s.district, s.region, s.division, s.phone_display, s.phones.join(" ")].join(" "));
}
const indexed = SHOPS.map(s => ({ s, h: haystack(s) }));

function matches(entry) {
  const s = entry.s;
  if (state.division !== "all" && s.division !== state.division) return false;
  if (state.district !== "all" && s.district !== state.district) return false;
  const terms = norm(state.q).split(" ").filter(Boolean);
  return terms.every(t => entry.h.includes(t));
}

function renderChips() {
  const wrap = $("chips");
  wrap.innerHTML = "";
  ["all", ...districts].forEach(d => {
    const b = document.createElement("button");
    b.className = "chip" + (state.district === d ? " on" : "");
    b.textContent = d === "all" ? "All districts" : d;
    b.onclick = () => { state.district = d; render(); };
    wrap.appendChild(b);
  });
}

function render() {
  const results = indexed.filter(matches).map(e => e.s);
  $("clear").classList.toggle("show", state.q.length > 0);
  $("count").textContent = results.length + (results.length === 1 ? " garage" : " garages") + " found";
  renderChips();
  const list = $("list");
  if (!results.length) {
    list.innerHTML = '<div class="empty"><b>No garage found</b>Try a different word, such as the area name or district.</div>';
    return;
  }
  list.innerHTML = results.map(s => {
    const badgeCls = s.division === "Piki Piki" ? "badge pp" : "badge";
    const calls = s.phones.map(p => {
      const disp = p.replace(/^\+255(\d{3})(\d{3})(\d{3})$/, "+255 $1 $2 $3");
      return '<a class="call" href="tel:' + esc(p) + '" aria-label="Call ' + esc(s.name) + ' ' + esc(disp) + '">&#9742; ' + esc(disp) + '</a>';
    }).join("");
    const q = encodeURIComponent(s.name + ", " + s.location + ", " + s.district + ", " + s.region + ", Tanzania");
    const check = s.phone_needs_check ? '<div class="check">Phone number needs to be confirmed. Please check before calling.</div>' : "";
    return '<article class="card">' +
      '<div class="top"><p class="name">' + esc(s.name) + '</p><span class="' + badgeCls + '">' + esc(s.division) + '</span></div>' +
      '<p class="place">' + esc(s.location) + ' &middot; ' + esc(s.district) + ', ' + esc(s.region) + '</p>' +
      '<div class="phones">' + calls + '<a class="map" href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" rel="noopener">Map</a></div>' +
      check +
      '</article>';
  }).join("");
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });
$("clear").onclick = () => { state.q = ""; $("q").value = ""; $("q").focus(); render(); };
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.division = b.dataset.v;
  [...$("seg").children].forEach(x => x.classList.toggle("on", x === b));
  render();
});
render();
</script>
</body>
</html>
